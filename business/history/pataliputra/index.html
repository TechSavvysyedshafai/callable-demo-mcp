<style>
/* Layout: full-screen 3D city with a field-notebook overlay: top bar, clue counter, mini-map, joystick, and a clue card that slides up. Single warm "excavation" look by choice. */
:root{
  --sand:#efe3cc; --paper:#fbf6ec; --ink:#2a1d14; --ink2:#6b5644; --brick:#b5653a; --teal:#2f6f73; --card:#fffaf2;
  --display:"Instrument Serif", Georgia, serif; --body:"Inter", "Noto Sans Devanagari", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{position:fixed;inset:0}
#view{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top, 0px));padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));pointer-events:none}
.title{pointer-events:auto;background:color-mix(in srgb,var(--card) 92%,transparent);border:1.5px solid var(--ink);padding:6px 10px;max-width:min(62vw,420px)}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.5vw,30px);line-height:1;margin:0}
.title p{margin:2px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
.row{display:flex;gap:6px}
.btn{font-family:var(--mono);font-size:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 10px;cursor:pointer}
.btn[aria-pressed="true"],.btn.dark{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.count{font-family:var(--mono);font-size:12px;background:var(--brick);color:#fff;padding:6px 10px;border:1.5px solid var(--ink)}
#map{width:132px;height:132px;border:1.5px solid var(--ink);background:var(--paper)}
.joy{position:absolute;left:max(18px, env(safe-area-inset-left, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));width:116px;height:116px;border-radius:50%;border:2px solid var(--ink);background:color-mix(in srgb,var(--card) 55%,transparent);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--ink);opacity:.8}
.help{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));font-family:var(--mono);font-size:11px;color:var(--ink);background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--ink);padding:5px 8px;max-width:52vw}
.card{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:68%;overflow:auto;background:var(--card);border:2px solid var(--ink);padding:14px 16px 12px;box-shadow:0 10px 30px rgba(42,29,20,.25)}
.card .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brick)}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:2px 0 8px;text-wrap:balance}
.card p{margin:0 0 8px}
.card .src{border-left:3px solid var(--teal);padding:4px 10px;background:color-mix(in srgb,var(--teal) 8%,var(--card));font-size:14px}
.card .src b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);display:block}
.card .think{font-weight:600}
.card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.list{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.list button{width:100%;text-align:left;font:inherit;font-size:14px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 9px;cursor:pointer}
.list button.found{background:var(--teal);color:#fff;border-color:var(--teal)}
@media (max-width:520px){#map{width:96px;height:96px}.help{display:none}.joy{width:100px;height:100px}}
</style>

</div>

 {id:'megas', pos:[4, 0, 74], en:'A Greek visitor\'s report', hi:'एक यूनानी यात्री का वर्णन',

  think:['Historians say Megasthenes "got several things about India wrong". Why should we still read him, and how can we check him?','इतिहासकार कहते हैं कि मेगस्थनीज़ ने भारत के बारे में "कई बातें गलत लिखीं"। फिर भी उसे क्यों पढ़ें, और उसकी बातें कैसे जाँचें?']},
 {id:'moat', pos:[-14, 0, 62], en:'The moat', hi:'खाई',
  what:['A wide ditch full of water ran outside the wall. It defended the city and also carried away its waste water. In this model the moat is drawn much narrower than the size Megasthenes gives, so the city fits on screen.','दीवार के बाहर पानी से भरी चौड़ी खाई थी। यह शहर की रक्षा करती थी और गंदा पानी भी बहा ले जाती थी। इस मॉडल में खाई मेगस्थनीज़ के बताए आकार से बहुत पतली दिखाई गई है, ताकि शहर स्क्रीन में आ जाए।'],
  src:['Arrian, quoting Megasthenes: "the city has been surrounded with a ditch in breadth 600 feet, and in depth 45 feet." Strabo adds that it "serves the purpose of defence and of a sewer for the city."','एरियन, मेगस्थनीज़ के हवाले से: "शहर के चारों ओर 600 फ़ुट चौड़ी और 45 फ़ुट गहरी खाई है।" स्ट्राबो जोड़ता है कि यह "रक्षा और शहर के नाले, दोनों का काम करती है।"'],

 {id:'wall', pos:[14, 0, 46], en:'The timber wall (Bulandi Bagh)', hi:'लकड़ी की दीवार (बुलंदी बाग़)',
  what:['Megasthenes said the city had a wooden wall. Excavators at Bulandi Bagh in Patna found it: two parallel rows of upright sal-wood beams about 12 feet high, about 14½ feet apart, with a plank floor between them.','मेगस्थनीज़ ने कहा था कि शहर की दीवार लकड़ी की थी। पटना के बुलंदी बाग़ में खुदाई करने वालों को यह मिली: साल की लकड़ी के खड़े खंभों की दो समांतर पंक्तियाँ, लगभग 12 फ़ुट ऊँची, करीब साढ़े 14 फ़ुट की दूरी पर, बीच में तख़्तों का फ़र्श।'],

 {id:'gate', pos:[0, 0, 40], en:'Towers and gates', hi:'बुर्ज और द्वार',
  what:['The wall had holes for shooting arrows, towers along it and many gates. This model shows one gate and a few towers; the numbers below come only from Megasthenes and have not been checked by excavation.','दीवार में तीर चलाने के छेद, उसके साथ-साथ बुर्ज और कई द्वार थे। यह मॉडल एक द्वार और कुछ बुर्ज दिखाता है; नीचे की संख्याएँ केवल मेगस्थनीज़ से हैं, खुदाई से जाँची नहीं गईं।'],
  src:['Arrian, quoting Megasthenes: "its wall has 570 towers and 64 gates." Strabo: "a wooden wall pierced with openings through which arrows may be discharged."','एरियन, मेगस्थनीज़ के हवाले से: "इसकी दीवार में 570 बुर्ज और 64 द्वार हैं।" स्ट्राबो: "लकड़ी की दीवार जिसमें तीर चलाने के छेद हैं।"'],
  think:['Which parts of Megasthenes\' description has archaeology confirmed so far, and which are still only his word?','मेगस्थनीज़ के वर्णन के कौन-से हिस्से खुदाई ने अब तक पक्के किए, और कौन-से अभी केवल उसकी बात हैं?']},
 {id:'hall', pos:[26, 0, -14], en:'The pillared hall (Kumhrar)', hi:'स्तंभों वाला सभागार (कुम्हरार)',
  what:['At Kumhrar in Patna, excavators found the remains of a great hall that stood on rows of polished sandstone pillars about 15 feet apart, about 80 in all, over a thick layer of ash: the building had burned. Was it a palace or an audience hall? Archaeologists disagree.','पटना के कुम्हरार में खुदाई करने वालों को एक बड़े सभागार के अवशेष मिले, जो पॉलिश किए बलुआ पत्थर के खंभों की पंक्तियों पर खड़ा था, लगभग 15 फ़ुट की दूरी पर, कुल करीब 80, और नीचे राख की मोटी परत: इमारत जल गई थी। यह महल था या सभा-कक्ष? पुरातत्वविद एकमत नहीं हैं।'],
  src:['Rajani & Singh: D. B. Spooner (1912-13) found "the remains of an 80-pillared hall, which Spooner concluded was a Maurya palace"; later excavators (1951-55) "suggested that the structure may have been an audience hall rather than a palace."','राजानी और सिंह: डी. बी. स्पूनर (1912-13) को "80 स्तंभों वाले सभागार के अवशेष" मिले, जिसे उसने मौर्य महल माना; बाद के उत्खननकर्ताओं (1951-55) ने "सुझाया कि यह महल के बजाय सभा-कक्ष रहा होगा।"'],
  think:['Two experts looked at the same remains and disagreed. What extra evidence would settle it?','दो विशेषज्ञों ने एक ही अवशेष देखकर अलग राय दी। कौन-सा अतिरिक्त प्रमाण इसे तय करेगा?']},
 {id:'drain', pos:[-4.6, 0, 12], en:'A wooden drain', hi:'लकड़ी की नाली',
  what:['Like the moat, the city also had covered drains, here built of timber. One found at Bulandi Bagh was big enough for a person to walk through bent over.','खाई की तरह, शहर में ढकी नालियाँ भी थीं, यहाँ लकड़ी की बनी। बुलंदी बाग़ में मिली एक नाली इतनी बड़ी थी कि आदमी झुककर उसमें चल सके।'],
  src:['Pataliputra Excavation report (1955-56): "a 40 ft. long drain at Bulandibagh… its inner height was 6 feet 3 inches and the breadth was 3 feet 6 inches."','पाटलिपुत्र उत्खनन रिपोर्ट (1955-56): "बुलंदीबाग़ में 40 फ़ुट लंबी नाली… अंदर की ऊँचाई 6 फ़ुट 3 इंच और चौड़ाई 3 फ़ुट 6 इंच।"'],
  think:['Compare this drain with Mohenjo-daro\'s brick drains, about 2,000 years older. What is the same, and what changed?','इस नाली की तुलना लगभग 2,000 साल पुराने मोहनजोदड़ो की ईंट की नालियों से कीजिए। क्या एक जैसा है, और क्या बदला?']},
 {id:'wheel', pos:[-20, 0, 8], en:'A spoked wheel', hi:'तीलियों वाला पहिया',
  what:['Among the finds at Bulandi Bagh was a large wooden wheel with spokes and an iron rim. Carts and chariots moved goods and people through the capital.','बुलंदी बाग़ की खोजों में लकड़ी का एक बड़ा तीलियों वाला पहिया था, जिसकी किनारी लोहे की थी। गाड़ियाँ और रथ राजधानी में सामान और लोगों को ले जाते थे।'],
  src:['Rajani & Singh: "One of the unique finds was a large wooden spoked wheel with an iron rim."','राजानी और सिंह: "एक अनोखी खोज लोहे की किनारी वाला लकड़ी का बड़ा तीलियों वाला पहिया था।"'],
  think:['Wood usually rots. Why might so much timber have survived under Patna?','लकड़ी आमतौर पर सड़ जाती है। पटना की ज़मीन के नीचे इतनी लकड़ी क्यों बची रह गई होगी?']},
 {id:'boy', pos:[-20, 0, -12], en:'The "smiling boy"', hi:'"मुस्कुराता बालक"',

  src:['Rajani & Singh: finds included "the famous \'smiling boy\' and female dancing figures in swirling skirts presently on display in the Bihar Museum".','राजानी और सिंह: खोजों में "प्रसिद्ध \'मुस्कुराता बालक\' और घूमते घाघरे वाली नर्तकी मूर्तियाँ, जो अभी बिहार संग्रहालय में प्रदर्शित हैं"।'],
  think:['Megasthenes wrote about kings and armies. What do small clay toys and figures tell us that his book does not?','मेगस्थनीज़ ने राजाओं और सेनाओं के बारे में लिखा। मिट्टी के छोटे खिलौने और मूर्तियाँ हमें क्या बताती हैं जो उसकी किताब नहीं बताती?']}
];

function plankTex(base, gap, vertical){
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const x = c.getContext('2d'); x.fillStyle = gap; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 8; i++){ const s = 0.85 + ((i*7) % 5)/25; x.fillStyle = `rgb(${Math.round(base[0]*s)},${Math.round(base[1]*s)},${Math.round(base[2]*s)})`;
    if (vertical) x.fillRect(i*32 + 2, 0, 28, 256); else x.fillRect(0, i*32 + 2, 256, 28);
    x.strokeStyle = 'rgba(0,0,0,0.12)'; for (let k = 0; k < 4; k++){ x.beginPath(); if (vertical){ x.moveTo(i*32 + 6 + k*6, 0); x.lineTo(i*32 + 8 + k*6, 256); } else { x.moveTo(0, i*32 + 6 + k*6); x.lineTo(256, i*32 + 8 + k*6); } x.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-en]').forEach(el => el.textContent = el.getAttribute(LANG === 'hi' ? 'data-hi' : 'data-en'));
  $('lang').textContent = LANG === 'hi' ? 'English' : 'हिंदी'; $('clues').textContent = T('Clues', 'सुराग'); updateCount();
  if (!card.hidden) card.hidden = true;
}
$('lang').onclick = () => { LANG = LANG === 'hi' ? 'en' : 'hi'; try { localStorage.setItem('ptl-lang', LANG); } catch (e) {} applyLang(); };

// ---------- mini-map ----------
const mc = $('map').getContext('2d');
function drawMap(){
  const Wd = 264, s = Wd/200, X = x => (x + 100)*s, Z = z => (z + 110)*s;
  mc.fillStyle = '#fbf6ec'; mc.fillRect(0, 0, Wd, Wd);
  mapLayer(mc, X, Z, s);
  markers.forEach(m => { mc.fillStyle = found.has(m.c.id) ? '#2f6f73' : '#b5653a'; mc.beginPath(); mc.arc(X(m.c.pos[0]), Z(m.c.pos[2]), 5, 0, 7); mc.fill(); });
  mc.save(); mc.translate(X(P.x), Z(P.z)); mc.rotate(-P.yaw); mc.fillStyle = '#2a1d14'; mc.beginPath(); mc.moveTo(0, -11); mc.lineTo(7, 7); mc.lineTo(-7, 7); mc.closePath(); mc.fill(); mc.restore();
  mc.fillStyle = '#6b5644'; mc.font = '18px IBM Plex Mono, monospace'; mc.fillText('N', Wd/2 - 6, 20);
}

// ---------- loop ----------
function size(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();
let lastT = performance.now(), eye = 1.6;
function frame(now){
  const dt = Math.max(0, Math.min(0.05, (now - lastT)/1000)); lastT = now;
  let f = 0, s = 0;
  if (keys['w'] || keys['arrowup']) f += 1; if (keys['s'] || keys['arrowdown']) f -= 1;
  if (keys['a']) s -= 1; if (keys['d']) s += 1;
  if (keys['arrowleft']) P.yaw += dt*1.8; if (keys['arrowright']) P.yaw -= dt*1.8;
  f += -joy.y; s += joy.x;
  if (Math.abs(joy.x) > 0.6) P.yaw -= joy.x*dt*0.9;
  const sp = 5.5*dt, fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  const nx = P.x + (fx*f + rx*s)*sp, nz = P.z + (fz*f + rz*s)*sp;
  const cur = heightAt(P.x, P.z), nh = heightAt(nx, nz);
  if (!blocked(nx, P.z) && Math.abs(heightAt(nx, P.z) - cur) < 1.5) P.x = nx;
  if (!blocked(P.x, nz) && Math.abs(heightAt(P.x, nz) - cur) < 1.5) P.z = nz;
  eye += (heightAt(P.x, P.z) + 1.6 - eye)*Math.min(1, dt*8);
  camera.position.set(P.x, eye, P.z);
  camera.rotation.order = 'YXZ'; camera.rotation.set(P.pitch, P.yaw, 0);
  const tt = now/1000;
  markers.forEach((m, i) => { m.beacon.rotation.y = tt*1.5 + i; m.beacon.position.y = m.c.pos[1] + 2.6 + Math.sin(tt*2 + i)*0.15; m.ring.scale.setScalar(1 + 0.12*Math.sin(tt*3 + i));
    const done = found.has(m.c.id); m.beacon.material.color.setHex(done ? 0x2f6f73 : 0x2f9fa8); });
  renderer.render(scene, camera); drawMap(); requestAnimationFrame(frame);
}
applyLang(); requestAnimationFrame(frame);
})();
</script>
