<style>
/* Layout: full-screen 3D city with a field-notebook overlay: top bar, clue counter, mini-map, joystick, and a clue card that slides up. Single warm "excavation" look by choice. */
:root{
  --sand:#efe3cc; --paper:#fbf6ec; --ink:#2a1d14; --ink2:#6b5644; --brick:#b5653a; --teal:#2f6f73; --card:#fffaf2;
  --display:"Instrument Serif", Georgia, serif; --body:"Inter", "Noto Sans Devanagari", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{position:fixed;inset:0}
#view{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top, 0px));padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));pointer-events:none}
.title{pointer-events:auto;background:color-mix(in srgb,var(--card) 92%,transparent);border:1.5px solid var(--ink);padding:6px 10px;max-width:min(62vw,420px)}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.5vw,30px);line-height:1;margin:0}
.title p{margin:2px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
.row{display:flex;gap:6px}
.btn{font-family:var(--mono);font-size:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 10px;cursor:pointer}
.btn[aria-pressed="true"],.btn.dark{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.count{font-family:var(--mono);font-size:12px;background:var(--brick);color:#fff;padding:6px 10px;border:1.5px solid var(--ink)}
#map{width:132px;height:132px;border:1.5px solid var(--ink);background:var(--paper)}
.joy{position:absolute;left:max(18px, env(safe-area-inset-left, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));width:116px;height:116px;border-radius:50%;border:2px solid var(--ink);background:color-mix(in srgb,var(--card) 55%,transparent);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--ink);opacity:.8}
.help{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));font-family:var(--mono);font-size:11px;color:var(--ink);background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--ink);padding:5px 8px;max-width:52vw}
.card{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:68%;overflow:auto;background:var(--card);border:2px solid var(--ink);padding:14px 16px 12px;box-shadow:0 10px 30px rgba(42,29,20,.25)}
.card .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brick)}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:2px 0 8px;text-wrap:balance}
.card p{margin:0 0 8px}
.card .src{border-left:3px solid var(--teal);padding:4px 10px;background:color-mix(in srgb,var(--teal) 8%,var(--card));font-size:14px}
.card .src b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);display:block}
.card .think{font-weight:600}
.card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.list{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.list button{width:100%;text-align:left;font:inherit;font-size:14px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 9px;cursor:pointer}
.list button.found{background:var(--teal);color:#fff;border-color:var(--teal)}
@media (max-width:520px){#map{width:96px;height:96px}.help{display:none}.joy{width:100px;height:100px}}

const CLUES = [
 {id:'street', pos:[2, 0, 30], en:'A street on a grid', hi:'जाल जैसी योजना वाली सड़क',

 {id:'house', pos:[17, 0, 17], en:'A courtyard house with a well', hi:'आँगन और कुएँ वाला घर',

 {id:'seal', pos:[-17, 0, -15], en:'A unicorn seal', hi:'एकश्रृंगी (यूनिकॉर्न) मुहर',
  what:['Small square seals of steatite, 2 to 4 cm wide, carry an animal and a short line of the Indus script. The one-horned "unicorn" is the most common animal. The script has still not been read.','सेलखड़ी (स्टीएटाइट) की छोटी चौकोर मुहरें, 2 से 4 सेमी चौड़ी, पर एक जानवर और सिंधु लिपि की छोटी पंक्ति होती है। एक सींग वाला "यूनिकॉर्न" सबसे आम है। यह लिपि आज तक पढ़ी नहीं जा सकी है।'],
  src:['Wikipedia, Indus Valley Civilisation: "Thousands of steatite seals have been recovered… squares of side 2 to 4 cm."','विकिपीडिया: सेलखड़ी की हज़ारों मुहरें मिली हैं… 2 से 4 सेमी के वर्ग।'],
  think:['Seals were pressed into clay on bundles of goods. What job do they seem to do?','मुहरें सामान के बंडलों पर मिट्टी में दबाई जाती थीं। उनका काम क्या लगता है?']},
 {id:'weights', pos:[6, 0, -6], en:'Cubical stone weights', hi:'घनाकार पत्थर के बाट',
  what:['Traders used carefully cut cubes of chert as weights, in a fixed series of sizes, and the same kinds of weights turn up across the Indus region. Scholars describe the series differently: some as doubling (1, 2, 4, 8…), others with decimal steps.','व्यापारी चर्ट पत्थर के सावधानी से कटे घनों को बाट के रूप में इस्तेमाल करते थे, तय आकारों की एक शृंखला में, और ऐसे ही बाट पूरे सिंधु क्षेत्र में मिलते हैं। विद्वान इस शृंखला को अलग-अलग बताते हैं: कुछ दोगुने क्रम (1, 2, 4, 8…) में, कुछ दशमलव क्रम में।'],
  src:['Wikipedia: "Cubical weights, standardised throughout the Indus cultural zone; 2600–1900 BC; chert."','विकिपीडिया: घनाकार बाट, पूरे सिंधु क्षेत्र में मानकीकृत; 2600–1900 ई.पू.; चर्ट।'],
  think:['Why would the same weights in many cities help trade?','कई शहरों में एक जैसे बाट होने से व्यापार को कैसे मदद मिलती?']},
 {id:'beads', pos:[-17, 0, 22], en:'A bead workshop', hi:'मनकों की कार्यशाला',
  what:['Craftspeople drilled and polished beads from carnelian, a red stone, and made ornaments of shell and metal. This reconstruction shows a simple workshop; the beads are real Harappan craft products, the room is imagined.','कारीगर लाल पत्थर कार्नेलियन से मनके छेदते और चमकाते थे, और शंख व धातु के गहने बनाते थे। यह पुनर्निर्माण एक सरल कार्यशाला दिखाता है; मनके असली हड़प्पाई शिल्प हैं, कमरा काल्पनिक है।'],
  src:['NCERT Class 12 History, Bricks, Beads and Bones, discusses carnelian bead-making in Harappan cities (chapter name to be checked against your edition).','NCERT कक्षा 12 इतिहास का अध्याय "ईंटें, मनके और अस्थियाँ" हड़प्पाई शहरों में कार्नेलियन मनके बनाने की चर्चा करता है (अपने संस्करण से अध्याय का नाम जाँच लें)।'],

 {id:'dancer', pos:[18, 0, -18], en:'The "Dancing Girl"', hi:'"नर्तकी" की मूर्ति',
  what:['A bronze statuette only 10.8 cm tall, found in Mohenjo-daro in 1926, made by the lost-wax method. She wears bangles up one arm and stands with a hand on her hip. Today she is in the National Museum, New Delhi.','केवल 10.8 सेमी ऊँची काँसे की मूर्ति, 1926 में मोहनजोदड़ो में मिली, लुप्त-मोम विधि से बनी। एक बाँह पर चूड़ियाँ हैं और एक हाथ कमर पर। आज यह राष्ट्रीय संग्रहालय, नई दिल्ली में है।'],
  src:['Archaeologist Mortimer Wheeler (1973): "She\'s about fifteen years old probably… perfectly confident of herself and the world." (quoted in the Sindh Government leaflet)','पुरातत्वविद मॉर्टिमर व्हीलर (1973): "वह शायद पंद्रह साल की है… अपने और दुनिया के बारे में पूरी तरह आत्मविश्वासी।" (सिंध सरकार की पुस्तिका में उद्धृत)'],
  think:['Nobody knows she was a dancer. What in the figure made archaeologists give her that name?','कोई नहीं जानता कि वह नर्तकी थी। मूर्ति में ऐसा क्या है कि पुरातत्वविदों ने उसे यह नाम दिया?']},
 {id:'bath', pos:[-58, 4.2, 0], en:'The Great Bath', hi:'विशाल स्नानागार',
  what:['On the raised citadel in the west lies a brick pool 12 m long, 7 m wide and 2.4 m deep, made watertight with a lining of bitumen (natural tar). Steps lead down at the north and south ends.','पश्चिम के ऊँचे दुर्ग पर ईंटों का एक कुंड है, 12 मीटर लंबा, 7 मीटर चौड़ा और 2.4 मीटर गहरा, जिसे बिटुमेन (प्राकृतिक तारकोल) की परत से जलरोधी बनाया गया। उत्तर और दक्षिण में सीढ़ियाँ नीचे जाती हैं।'],
  src:['Sindh Government heritage leaflet: "The pool measures 12m long, 7m wide and 2.4m deep. It may have been used for religious purification."','सिंध सरकार की धरोहर पुस्तिका: कुंड 12 मीटर लंबा, 7 मीटर चौड़ा और 2.4 मीटर गहरा है। शायद इसका उपयोग धार्मिक शुद्धि के लिए होता था।'],
  think:['Notice the words "may have been". Why can\'t historians be sure what the Great Bath was for?','"शायद" शब्द पर ध्यान दीजिए। इतिहासकार पक्का क्यों नहीं कह सकते कि स्नानागार किस काम आता था?']}
];
const found = new Set();

// ---------- 3D city ----------
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3d9a8); scene.fog = new THREE.Fog(0xf3d9a8, 60, 170);
const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xfff3dc, 0xb08a5a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-40, 80, 30); scene.add(sun);
function brickTex(base, mortar, w = 256, h = 128, rows = 8){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.fillStyle = mortar; x.fillRect(0, 0, w, h); const bh = h/rows, bw = bh*2*1.0;   // bricks drawn long side 2 : 1 on the face (1 : 2 : 4 brick)
  for (let r = 0; r < rows; r++) for (let i = -1; i < w/bw + 1; i++){
    const off = (r % 2) * bw/2, s = 0.88 + ((r*7 + i*13) % 9)/60;
    x.fillStyle = `rgb(${Math.round(base[0]*s)},${Math.round(base[1]*s)},${Math.round(base[2]*s)})`;
    x.fillRect(i*bw + off + 1, r*bh + 1, bw - 2, bh - 2);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const BRICK = brickTex([181, 101, 58], '#d9b98f'), BRICK2 = brickTex([160, 88, 50], '#cfae84');
function mat(tex, rx, ry){ const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return new THREE.MeshLambertMaterial({map:t}); }
const sandMat = new THREE.MeshLambertMaterial({color:0xe2c79a});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), sandMat); ground.rotation.x = -Math.PI/2; scene.add(ground);
const streetMat = new THREE.MeshLambertMaterial({color:0xd4b483});
const colliders = [];   // axis-aligned boxes the walker cannot enter: [minx, maxx, minz, maxz]
function wall(x0, x1, z0, z1, h, m, y0 = 0){
  const w = x1 - x0, d = z1 - z0, g = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(g, m || mat(BRICK, Math.max(w, d)/4, h/2)); mesh.position.set((x0 + x1)/2, y0 + h/2, (z0 + z1)/2); scene.add(mesh);
  if (y0 < 1) colliders.push([x0, x1, z0, z1]); return mesh;
}
// streets (lower town: main N-S street at x = 0, main E-W street at z = 0, both 8 m wide)
const st1 = new THREE.Mesh(new THREE.PlaneGeometry(8, 120), streetMat); st1.rotation.x = -Math.PI/2; st1.position.set(0, 0.01, 0); scene.add(st1);
const st2 = new THREE.Mesh(new THREE.PlaneGeometry(120, 8), streetMat); st2.rotation.x = -Math.PI/2; st2.position.set(30, 0.01, 0); scene.add(st2);
// covered drains along both sides of the main N-S street, with lifted cover slabs here and there
const drainMat = new THREE.MeshLambertMaterial({color:0x5a3a24}), coverMat = new THREE.MeshLambertMaterial({color:0xa86a42});
for (const side of [-1, 1]){
  const ch = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 120), drainMat); ch.position.set(side*3.55, 0.02, 0); scene.add(ch);
  for (let z = -58; z < 58; z += 0.75){ if ((Math.round(z*4) % 37) === 0) continue; const s = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.12, 0.68), coverMat); s.position.set(side*3.55, 0.07, z); scene.add(s); }
}
// courtyard houses in the four lower-town quadrants, doors on the lanes, blank walls to the main streets
function house(cx, cz, w, d, h, doorSide){

  };

}
